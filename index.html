<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Comparison</title>
    
    <style>
        /* =================================================================== */
        /* === CSS STYLES ==================================================== */
        /* =================================================================== */
        
        /* Basic Page Styles */
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1, p { text-align: center; }

        /* Mod.io Button Styles */
        .modio-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .modio-btn {
            display: inline-block;
            background-color: #2e6ff3; /* Mod.io style blue */
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: background-color 0.2s, transform 0.2s;
        }

        .modio-btn:hover {
            background-color: #1a5be0;
            transform: translateY(-2px);
        }

        /* Main Container for the Slider */
        #image-compare-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: ew-resize;
            user-select: none;
            line-height: 0;
        }

        /* Base image (1.png). It defines the container's size.
           max-width AND max-height together preserve the aspect ratio,
           so nothing ever gets cropped or clamped unevenly. */
        #image-compare-container #base-image {
            display: block;
            max-width: 90vw;
            max-height: 80vh;
        }

        /* Top image (2.png). FORCED into the exact same box as the base image,
           no matter its own resolution. JS reveals it with clip-path. */
        #image-compare-container #top-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* maps the full image onto the same box */
            clip-path: inset(0 50% 0 0); /* initial 50/50 split, JS updates this */
            pointer-events: none;
            z-index: 2;
        }

        /* Vertical divider line, moves with the slider */
        #image-compare-container .slider-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background-color: white;
            transform: translateX(-50%);
            z-index: 9;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        /* The draggable handle */
        #image-compare-container .slider-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 50px;
            width: 50px;
            background-color: white;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        #image-compare-container:hover .slider-handle { opacity: 1; }

        .slider-handle .slider-arrow {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }
        .slider-handle .left { border-right: 10px solid #333; }
        .slider-handle .right { border-left: 10px solid #333; }

        /* Labels (content is injected by JS) */
        #image-compare-container .slider-handle::before,
        #image-compare-container .slider-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            line-height: normal;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
        }

        #image-compare-container .slider-handle::before {
            right: 100%;
            margin-right: 15px;
        }

        #image-compare-container .slider-handle::after {
            left: 100%;
            margin-left: 15px;
        }

        /* === Comparison Selector === */
        #comparison-selector-container {
            margin-bottom: 20px;
            text-align: center;
        }

        #comparison-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        #comparison-selector button {
            background-color: #333;
            color: #f0f0f0;
            border: 2px solid #555;
            border-radius: 5px;
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        #comparison-selector button:hover {
            background-color: #444;
            border-color: #777;
        }

        #comparison-selector button.active {
            background-color: #007bff;
            border-color: #0056b3;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Image Comparison</h1>

    <!-- Mod.io Call to Action Link -->
    <div class="modio-container">
        <a href="https://mod.io/g/insurgencysandstorm/m/overhaul#description" target="_blank" rel="noopener noreferrer" class="modio-btn">
            Download the mod on Mod.io!
        </a>
    </div>

    <div id="comparison-selector-container">
        <h2>Select a Comparison:</h2>
        <div id="comparison-selector"></div>
    </div>

    <div id="image-compare-container">
        <!-- Bottom layer: 1.png. This image defines the container size. -->
        <img id="base-image" src="" alt="Original">

        <!-- Top layer: 2.png. Stretched over the SAME box, revealed via clip-path. -->
        <img id="top-image" src="" alt="Modded">

        <!-- Vertical divider line -->
        <div class="slider-line"></div>

        <!-- The draggable handle -->
        <div class="slider-handle">
            <div class="slider-arrow left"></div>
            <div class="slider-arrow right"></div>
        </div>
    </div>

    <script>
        // ===================================================================
        // === JAVASCRIPT LOGIC ==============================================
        // ===================================================================
        
        // On GitHub Pages, folders are AUTO-DISCOVERED via the GitHub API:
        // just push a folder containing 1.png and 2.png and a button appears.
        // This list is only used as a fallback (e.g. running locally).
        const fallbackFolders = [
            'customize',
            'range',
            'mainmenu',
            'shotgunmod'
        ];

        // Optional: folders that should never become buttons
        const excludeFolders = [];

        // Optional: force the repo as 'username/repo'. Only needed if you use a
        // CUSTOM DOMAIN (auto-detection only works on *.github.io URLs).
        // Leave '' for auto-detection.
        const githubRepo = '';

        const labelRight = 'MODDED';   // 1.png (revealed on the right)
        const labelLeft  = 'Original'; // 2.png (revealed on the left)

        document.addEventListener('DOMContentLoaded', () => {
            // --- Element References ---
            const container = document.getElementById('image-compare-container');
            const baseImage = document.getElementById('base-image');
            const topImage  = document.getElementById('top-image');
            const handle    = container.querySelector('.slider-handle');
            const line      = container.querySelector('.slider-line');
            const selectorContainer = document.getElementById('comparison-selector');
            const mainTitle = document.querySelector('h1');

            let availableFolders = [];

            // --- Dynamic Label Setup ---
            const styleSheet = document.createElement("style");
            styleSheet.innerText = `
                #image-compare-container .slider-handle::before { content: '${labelLeft}'; }
                #image-compare-container .slider-handle::after  { content: '${labelRight}'; }
            `;
            document.head.appendChild(styleSheet);

            // --- Core Function to Load a Comparison ---
            function loadComparison(folderName) {
                if (!availableFolders.includes(folderName)) {
                    console.error(`Error: Folder "${folderName}" is not available.`);
                    return;
                }

                baseImage.src = `${folderName}/1.png`;
                topImage.src  = `${folderName}/2.png`;

                mainTitle.textContent = folderName.replace(/-/g, ' ');

                document.querySelectorAll('#comparison-selector button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.folder === folderName);
                });

                // Update URL hash for deep linking (only if it actually changed,
                // to avoid re-triggering hashchange unnecessarily)
                if (window.location.hash.substring(1) !== folderName) {
                    window.location.hash = folderName;
                }
            }

            // --- UI Generation: Create a button for each folder ---
            function buildButtons(folders) {
                selectorContainer.innerHTML = '';
                folders.forEach(folder => {
                    const button = document.createElement('button');
                    button.textContent = folder.replace(/-/g, ' ');
                    button.dataset.folder = folder;
                    button.addEventListener('click', () => loadComparison(folder));
                    selectorContainer.appendChild(button);
                });
            }

            // --- Initialization on Page Load ---
            function initialize() {
                const initialFolder = window.location.hash.substring(1);

                if (initialFolder && availableFolders.includes(initialFolder)) {
                    loadComparison(initialFolder);
                } else if (availableFolders.length > 0) {
                    loadComparison(availableFolders[0]);
                }
            }

            // --- Auto-discovery of folders when hosted on GitHub Pages ---
            async function discoverFolders() {
                try {
                    let owner, repo;

                    if (githubRepo) {
                        [owner, repo] = githubRepo.split('/');
                    } else {
                        const host = window.location.hostname;
                        if (!host.endsWith('.github.io')) {
                            throw new Error('Not running on GitHub Pages');
                        }
                        owner = host.split('.')[0];
                        const parts = window.location.pathname.split('/').filter(Boolean);
                        // 'user.github.io/' -> root repo named after the user,
                        // 'user.github.io/repo/' -> project page
                        repo = parts.length > 0 ? parts[0] : owner;
                    }

                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
                    if (!res.ok) throw new Error(`GitHub API responded with ${res.status}`);

                    const entries = await res.json();
                    const folders = entries
                        .filter(entry => entry.type === 'dir')
                        .map(entry => entry.name)
                        .filter(name => !name.startsWith('.') && !excludeFolders.includes(name));

                    if (folders.length === 0) throw new Error('No folders found in repo root');

                    console.log('Auto-discovered comparison folders:', folders);
                    return folders;
                } catch (err) {
                    console.warn(`Folder auto-discovery failed (${err.message}). Using fallback list.`);
                    return fallbackFolders;
                }
            }

            // --- Slider Dragging Logic (clip-path based, always pixel-aligned) ---
            let isDragging = false;

            function moveSlider(x) {
                const rect = container.getBoundingClientRect();
                let position = ((x - rect.left) / rect.width) * 100;
                position = Math.max(0, Math.min(100, position));
                // Reveal the top image from the left edge up to the slider position
                topImage.style.clipPath = `inset(0 ${100 - position}% 0 0)`;
                handle.style.left = `${position}%`;
                line.style.left = `${position}%`;
            }

            container.addEventListener('mousedown', e => { isDragging = true; e.preventDefault(); });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('mousemove', e => { if (isDragging) moveSlider(e.clientX); });
            container.addEventListener('touchstart', e => { isDragging = true; }, { passive: false });
            window.addEventListener('touchend', () => { isDragging = false; });
            window.addEventListener('touchmove', e => {
                if (isDragging) { e.preventDefault(); moveSlider(e.touches[0].clientX); }
            }, { passive: false });

            // --- Final Setup ---
            (async () => {
                availableFolders = await discoverFolders();
                buildButtons(availableFolders);
                initialize();
            })();

            window.addEventListener('hashchange', initialize);
        });
    </script>
</body>
</html>
